<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VAR Studio</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="site-header">

    <a href="index.html" class="logo">
        VAR<span>STUDIO</span>
    </a>

    <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false">
        <span></span><span></span><span></span>
    </button>

    <nav id="main-nav">

        <a href="index.html" class="active">
            Home
        </a>

        <a href="characters/characters.html">
            Characters
        </a>

        <a href="portfolio.html">
            Portfolio
        </a>

        <a href="service/service.html">
            Services
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section id="home" class="hero">

    <div class="hero-content">

        <h1>
            CREATE.
            <br>
            CAPTURE.
            <br>
            INSPIRE.
        </h1>

        <p>
            Creative studio for photography,
            design and digital experiences.
        </p>

        <button type="button" id="explore-work">
            Explore Work
        </button>

    </div>

</section>


<!-- =====================================================
     PORTFOLIO MODAL
===================================================== -->

<div
    class="portfolio-modal"
    id="portfolio-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="portfolio-title"
    hidden
>

    <div class="modal-panel">

        <button
            type="button"
            class="modal-close"
            id="modal-close"
            aria-label="Close portfolio"
        >
            &times;
        </button>

        <p class="modal-label">
            VAR STUDIO
        </p>

        <h2 id="portfolio-title">
            Selected Works
        </h2>

        <p class="modal-intro">
            A selection of photography, video and digital design projects.
        </p>

        <div class="modal-gallery">

            <img
                src="images/1.jpg"
                alt="Portfolio project 1"
            >

            <img
                src="images/2.jpg"
                alt="Portfolio project 2"
            >

            <img
                src="images/3.jpg"
                alt="Portfolio project 3"
            >

        </div>

        <a
            class="portfolio-link"
            href="portfolio.html"
            id="view-portfolio"
        >
            View portfolio section
        </a>

    </div>

</div>

<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    © 2026 VAR Studio

</footer>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/header.js"></script>
<script src="js/script.js"></script>

</body>

</html>
